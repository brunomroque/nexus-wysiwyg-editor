<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>

    <!-- Left Pillar (Violet) -->
    <linearGradient id="leftPillar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <!-- Diagonal Ribbon / Pen Nib (Nexus Core) -->
    <linearGradient id="diagonalCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="35%" stop-color="#a855f7" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Right Pillar (Cyan-Blue) -->
    <linearGradient id="rightPillar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="nexusGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="outerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#a855f7" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Subtle Top Specular Highlight -->
  <path d="M 16 28 C 30 14, 98 14, 112 28" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Nexus 'N' Icon Geometry -->
  <g filter="url(#outerGlow)">
    <!-- Left Vertical Stem -->
    <path d="M 32 34 L 46 34 L 46 94 L 32 94 Z" rx="3" fill="url(#leftPillar)" />

    <!-- Right Vertical Stem -->
    <path d="M 82 34 L 96 34 L 96 94 L 82 94 Z" rx="3" fill="url(#rightPillar)" />

    <!-- Diagonal Interlocking Bridge & Pen Nib Nexus -->
    <path d="M 32 34 L 48 34 L 96 90 L 80 90 Z" fill="url(#diagonalCore)" opacity="0.95" />

    <!-- Stylized AI Sparkle at the Nexus Point -->
    <path d="M 64 56 Q 64 62, 70 62 Q 64 62, 64 68 Q 64 62, 58 62 Q 64 62, 64 56 Z" fill="#ffffff" filter="url(#nexusGlow)" />
  </g>
</svg>
