<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120">
  <defs>
    <!-- Background Gradient for Icon -->
    <linearGradient id="iconBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.3" />
    </linearGradient>

    <!-- Left Pillar (Violet) -->
    <linearGradient id="leftPillar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <!-- Diagonal Ribbon / Pen Nib -->
    <linearGradient id="diagonalCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="35%" stop-color="#a855f7" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Right Pillar (Cyan-Blue) -->
    <linearGradient id="rightPillar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Text Gradient for NEXUS (Dark Mode) -->
    <linearGradient id="textGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Text Gradient for NEXUS (Light Mode Fallback) -->
    <linearGradient id="textGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Text Gradient for EDITOR -->
    <linearGradient id="editorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="iconGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#a855f7" flood-opacity="0.45" />
    </filter>

    <filter id="sparkleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .nexus-title-text {
      fill: url(#textGradLight);
    }
    @media (prefers-color-scheme: dark) {
      .nexus-title-text {
        fill: url(#textGradDark);
      }
    }
  </style>

  <!-- ==================== ICON MARK (Left) ==================== -->
  <g transform="translate(10, 10)">
    <!-- Squircle Card -->
    <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#iconBgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

    <!-- Specular Highlight -->
    <path d="M 12 22 C 24 10, 76 10, 88 22" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-linecap="round" />

    <!-- 'N' Geometry -->
    <g filter="url(#iconGlow)">
      <!-- Left Stem -->
      <path d="M 24 26 L 36 26 L 36 74 L 24 74 Z" rx="2" fill="url(#leftPillar)" />

      <!-- Right Stem -->
      <path d="M 64 26 L 76 26 L 76 74 L 64 74 Z" rx="2" fill="url(#rightPillar)" />

      <!-- Diagonal Slash -->
      <path d="M 24 26 L 38 26 L 76 70 L 62 70 Z" fill="url(#diagonalCore)" opacity="0.95" />

      <!-- Sparkle -->
      <path d="M 50 45 Q 50 50, 55 50 Q 50 50, 50 55 Q 50 50, 45 50 Q 50 50, 50 45 Z" fill="#ffffff" filter="url(#sparkleGlow)" />
    </g>
  </g>

  <!-- ==================== WORDMARK (Right) ==================== -->
  <!-- "NEXUS" Brand Name -->
  <text x="135" y="65" class="nexus-title-text" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" letter-spacing="0.04em">
    NEXUS
  </text>

  <!-- "EDITOR" Accent -->
  <text x="312" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" letter-spacing="0.04em" fill="url(#editorGrad)">
    EDITOR
  </text>

  <!-- Subtitle Pill / Badge -->
  <g transform="translate(136, 78)">
    <rect x="0" y="0" width="220" height="22" rx="11" fill="rgba(139, 92, 246, 0.15)" stroke="rgba(168, 85, 247, 0.35)" stroke-width="1" />
    <text x="110" y="15" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, monospace" font-size="10.5" font-weight="700" letter-spacing="0.14em" fill="#c084fc">
      ENTERPRISE WYSIWYG • AI
    </text>
  </g>
</svg>